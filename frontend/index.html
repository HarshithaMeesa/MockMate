<!DOCTYPE html>
<html>
<head>
  <title>MockMate AI Interview</title>
</head>
<body>

<h2>MockMate – AI Interview Platform</h2>

<label>Role:</label>
<select id="role">
  <option>SDE</option>
  <option>HR</option>
  <option>Analyst</option>
</select>

<br><br>

<label>Upload Resume:</label>
<input type="file" id="resume">

<br><br>

<button onclick="goToInterview()">Start Interview</button>

<script>
function goToInterview() {
  const role = document.getElementById("role").value;
  window.location.href = `interview.html?role=${role}`;
}
</script>

</body>
</html>
